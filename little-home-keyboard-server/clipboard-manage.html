<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小剪贴板 · 管理</title><style>body{max-width:680px;margin:40px auto;padding:20px;background:#f8f6f2;color:#2c2c2c;font:16px system-ui}input,button{font:inherit;padding:12px;margin:8px 0;max-width:100%;box-sizing:border-box}input{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px dashed #aaa;padding:14px 0}</style><h1>小剪贴板</h1><p>管理凭证只在本页内存使用，不写入浏览器存储；离开后需重新填写。</p><input id="token" type="password" autocomplete="off" placeholder="本服务器的管理凭证"><button id="bind">给新手机一张绑定纸条</button><button id="clearToken">收好凭证</button><pre id="notice" role="status"></pre><input id="query" placeholder="找一找生活片段"><button id="search">看最近的小片段</button><div id="items"></div><button id="more" hidden>再看一些</button><script>
const $=id=>document.getElementById(id),prefix='/api/our-home/clipboard';let cursor=0;
async function request(path,method='POST',body={}){const r=await fetch(prefix+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},body:method==='GET'?undefined:JSON.stringify(body),cache:'no-store'});if(!r.ok)throw Error('没有完成，请检查凭证、连接和HTTPS。');return r.json()}
$('clearToken').onclick=()=>{$('token').value='';$('items').replaceChildren();$('notice').textContent='凭证和页面内容已收好。'};
$('bind').onclick=async()=>{try{const r=await request('/owner/binding-code');$('notice').textContent='五分钟内在键盘中填写：'+r.bindingCode}catch(e){$('notice').textContent=e.message}};
async function search(more=false){try{const r=await request('/owner/items/search','POST',{query:$('query').value,limit:20,cursor:more?cursor:0});if(!more)$('items').replaceChildren();for(const i of r.items){const a=document.createElement('article'),t=document.createElement('pre');t.textContent=i.text;const b=document.createElement('button');b.textContent='删除这一条';b.onclick=async()=>{if(!confirm('删除服务器上的这一条片段？'))return;try{await request('/owner/items/'+encodeURIComponent(i.id),'DELETE');a.remove()}catch(e){$('notice').textContent=e.message}};a.append(t,b);$('items').append(a)}cursor=r.nextCursor;$('more').hidden=!cursor;$('notice').textContent='只显示这次查到的小片段。'}catch(e){$('notice').textContent=e.message}}
$('search').onclick=()=>search();$('more').onclick=()=>search(true);
</script></html>
